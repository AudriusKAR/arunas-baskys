# Netlify konfigūracija.
# Puslapis statinis – nieko kompiliuoti nereikia, tik nurodom katalogą.
# Formų priėmimą Netlify įjungia automatiškai, radęs <form data-netlify="true">.

[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Subpuslapis „Paslaugos" panaikintas – jį atstoja pradžios puslapis
[[redirects]]
  from = "/paslaugos"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
